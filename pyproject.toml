[project]
name = "qanoun"
version = "0.1.0"
description = "Bilingual (French/Arabic/Darija) legal assistant for Moroccan law: RAG with verified article citations, AI agent, MCP server and evaluation suite."
readme = "README.md"
license = "MIT"
authors = [{ name = "Haytamzerr" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "huggingface-hub>=0.23",
    "numpy>=2.0",
    "onnxruntime>=1.18",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "qdrant-client>=1.19",
    "tokenizers>=0.19",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
    "httpx2>=2.13",
]
# The embedding model (BGE-M3) and its runtime (torch). Installed by default on a developer
# machine; CI skips it with UV_NO_GROUP=embeddings and tests use a small fake embedder instead.
embeddings = [
    "sentence-transformers>=5.0",
]

[tool.uv]
default-groups = ["dev", "embeddings"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests on the real PDFs take about a minute: skipped by default, run with `pytest -m slow`
addopts = "-q -m 'not slow'"
markers = ["slow: parses the real law PDFs (run with `uv run pytest -m slow`)"]
